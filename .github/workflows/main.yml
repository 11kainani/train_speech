name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22'  # Use the version of Node.js you prefer

    - name: Install dependencies
      working-directory: ./backend
      run: npm install

    - name: Run ESLint
      working-directory: ./backend
      run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22'  # Use the version of Node.js you prefer

    - name: Install dependencies
      working-directory: ./backend
      run: npm install

    - name: Run Jest tests
      working-directory: ./backend
      run: npm test
